  (function () {
    const carousel  = document.getElementById('reviewsCarousel');
    const dotsWrap  = document.getElementById('carouselDots');
    const btnPrev   = document.getElementById('reviewPrev');
    const btnNext   = document.getElementById('reviewNext');

    // Build cards
    REVIEWS.forEach((review, i) => {
      const initials = review.name.split(' ').map(n => n[0]).join('').slice(0, 2);
      const starsHTML = Array.from({length: 5}, (_, s) =>
        `<span class="${s < review.rating ? 'star-filled' : 'star-empty'}">★</span>`
      ).join('');

      const card = document.createElement('div');
      card.className = 'review-card';
      const badgeHTML = review.badge
        ? `<span class="review-badge">${review.badge}</span>`
        : '';

      card.innerHTML = `
        <div class="review-card-header">
          <div class="review-card-author">
            <div class="author-avatar" style="background:${review.avatarColor}">${initials}</div>
            <div class="author-details">
              <p class="author-name">${review.name}</p>
              <p class="author-meta">${review.title} · ${review.company}</p>
            </div>
          </div>
          <span class="google-g">G</span>
        </div>
        <div class="review-card-rating">
          <div class="rating-stars">${starsHTML}</div>
          <span class="review-date">${review.date}</span>
        </div>
        <p class="review-text">${review.review}</p>
        <div class="review-card-footer">
          <span class="review-project-tag">${review.projectType}</span>
          ${badgeHTML}
        </div>
      `;
      carousel.appendChild(card);

      // Dot
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', `Review ${i + 1}`);
      dot.addEventListener('click', () => scrollToCard(i));
      dotsWrap.appendChild(dot);
    });

    const cards = carousel.querySelectorAll('.review-card');
    const dots  = dotsWrap.querySelectorAll('.carousel-dot');

    function scrollToCard(index) {
      const card = cards[index];
      if (!card) return;
      carousel.scrollTo({ left: card.offsetLeft - carousel.offsetLeft, behavior: 'smooth' });
    }

    function updateDots() {
      const scrollLeft = carousel.scrollLeft;
      const cardWidth  = cards[0] ? cards[0].offsetWidth + 20 : 340;
      const active     = Math.round(scrollLeft / cardWidth);
      dots.forEach((d, i) => d.classList.toggle('active', i === active));
    }

    carousel.addEventListener('scroll', updateDots, { passive: true });

    btnPrev.addEventListener('click', () => {
      carousel.scrollBy({ left: -340, behavior: 'smooth' });
    });
    btnNext.addEventListener('click', () => {
      carousel.scrollBy({ left: 340, behavior: 'smooth' });
    });

    // Drag-to-scroll with mouse (touch already scrolls natively via overflow-x)
    const DRAG_THRESHOLD = 4;
    const drag = { active: false, moved: false, startX: 0, startScroll: 0 };

    carousel.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      drag.active = true;
      drag.moved = false;
      drag.startX = e.pageX;
      drag.startScroll = carousel.scrollLeft;
      carousel.classList.add('dragging');
    });
    window.addEventListener('mousemove', (e) => {
      if (!drag.active) return;
      const dx = e.pageX - drag.startX;
      if (Math.abs(dx) > DRAG_THRESHOLD) drag.moved = true;
      carousel.scrollLeft = drag.startScroll - dx;
    });
    window.addEventListener('mouseup', () => {
      drag.active = false;
      carousel.classList.remove('dragging');
    });
    // suppress the click that follows a drag so it doesn't open/scroll-snap unexpectedly
    carousel.addEventListener('click', (e) => {
      if (drag.moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  })();
</script>
